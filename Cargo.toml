[package]
name = "simple-bitset"
version = "0.1.7"
edition = "2021"
rust-version = "1.73"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-simple-bitset"
description = "Simple no-std compatible 64-bit and 128-bit bitsets for embedded applications"
keywords = ["no_std", "bitset", "embedded", "data-structures"]
categories = [
    "data-structures",
    "embedded",
    "no-std",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
default = []
serde = ["dep:serde", "postcard"]
storage = ["dep:sequential-storage", "serde"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io", "experimental-derive"], optional = true }
sequential-storage = { version = "8.0.1", default-features = false, features = ["postcard"], optional = true }

[workspace]
members = [
    ".",
    "xtask",
]
